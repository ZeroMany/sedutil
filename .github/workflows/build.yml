name: build

on:
  push:
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  linux:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: Install build tools
        run: sudo apt-get update && sudo apt-get install -y autoconf automake g++ make
      - name: Build
        run: |
          autoreconf -i
          ./configure
          make -j"$(nproc)"
      - name: Password hash self-test
        run: ./sedutil-cli --validatePBKDF2
      - uses: actions/upload-artifact@v4
        with:
          name: sedutil-linux-x64
          path: |
            sedutil-cli
            linuxpba

  windows:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: microsoft/setup-msbuild@v2
      - name: Build (Release x64)
        run: msbuild windows\CLI\CLI.sln /m /p:Configuration=Release /p:Platform=x64
      - name: Password hash self-test
        run: windows\CLI\x64\Release\sedutil-cli.exe --validatePBKDF2
      - uses: actions/upload-artifact@v4
        with:
          name: sedutil-windows-x64
          path: windows\CLI\x64\Release\sedutil-cli.exe
